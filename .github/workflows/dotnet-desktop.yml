# GitHub's ".NET Desktop" starter workflow:
# Build, test, sign and publish a desktop application built on .NET.
# https://github.com/actions/starter-workflows/blob/main/ci/dotnet-desktop.yml
#
# Sextant is an unpackaged Avalonia app, so this file keeps that workflow's
# shape and replaces the Windows Application Packaging (MSIX) project with
# `dotnet publish` for win-x64. There is no .wapproj. The macOS job publishes
# a self-contained osx-arm64 app. On a Mac that publish is a Sextant.app
# bundle. stamp-mac-app.sh ad-hoc signs that bundle. The SDK's loose apphost
# signature does not seal bundle resources, and Gatekeeper reports a
# quarantined copy as damaged. When the Apple secrets below are set, the
# macOS job signs that bundle with Developer ID, notarizes a zip, and staples
# the ticket before the tar. When APPLE_CERTIFICATE_BASE64 is empty, the
# ad-hoc signature stays, and a browser download still carries the quarantine
# attribute. The stapled or ad-hoc bundle is tarred so the app host stays
# executable, then uploaded with actions/upload-artifact@v7 and
# archive: false. The artifact name is the filename, Sextant-osx-arm64.tar.
# The Windows job still uploads a directory, which archive: false does not
# allow, so it stays on v4.
#
# Signing uses the same secrets as the starter workflow. Add them under
# Settings, Secrets and variables, Actions:
#
# 1. Base64_Encoded_Pfx
#    $pfx = Get-Content '.\SigningCertificate.pfx' -AsByteStream
#    [Convert]::ToBase64String($pfx) | Set-Content 'SigningCertificate_Encoded.txt'
#    Put the contents of that file in the secret. PowerShell 5 uses
#    -Encoding Byte instead of -AsByteStream.
# 2. Pfx_Key — the certificate password.
#
# When those secrets are empty, the build still tests and publishes, and
# skips Authenticode signing.
#
# https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# macOS Developer ID signing uses these secrets on the build-macos sign step.
# Add them under Settings, Secrets and variables, Actions. The step maps each
# one to an environment variable of the same name. A secret that is not
# mapped is not visible to the runner.
#
# 1. APPLE_CERTIFICATE_BASE64 — the Developer ID Application .p12, one line:
#    base64 < SigningCertificate.p12 | tr -d '\n'
# 2. APPLE_CERTIFICATE_PASSWORD — the .p12 password. A trailing newline
#    is ignored.
# 3. APPLE_TEAM_ID — the 10-character Team ID.
# 4. APPLE_API_KEY_ID — the App Store Connect API Key ID.
# 5. APPLE_API_ISSUER — the Issuer ID.
# 6. APPLE_API_KEY — the .p8 file contents, including the BEGIN and END lines.
#
# When APPLE_CERTIFICATE_BASE64 is empty, build-macos keeps the ad-hoc
# signature. When it is set, the other five are required.
#
# Tag releases live in release.yml. That workflow calls this one and passes
# the tag, such as v0.1.3-beta. The leading v only selects this workflow.
# Every imprint uses the rest: 0.1.3-beta. A branch build uses the nearest
# v* tag the same way. This file also accepts workflow_call for that reason.
# A push or a pull request to master runs only when src/ or tests/ changes.
# workflow_dispatch still starts a build by hand, and a tag release is not
# limited to those folders.
#
# The two Linux jobs publish self-contained linux-x64 and linux-arm64 apps on
# native runners and pack each: make-deb.sh builds a .deb for Ubuntu and Debian,
# and make-rpm.sh builds an .rpm for Fedora with rpmbuild. Both install the app
# to /opt/Sextant with a /usr/bin/Sextant symlink, desktop file, and icon.

name: Build all Platforms

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release tag, such as v0.1.3-beta. The leading v is removed before it is imprinted.
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  windows-x64:
    name: Windows x64 Build
    runs-on: windows-latest

    env:
      Solution_Name: Sextant.slnx
      Project_Path: src/Sextant.csproj
      Publish_Directory: artifacts/win-x64
      Runtime: win-x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Resolve the version from the tag
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: bash src/tools/resolve-version.sh

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Execute unit tests
      run: dotnet test $env:Solution_Name --configuration Release --verbosity normal

    - name: Publish the application
      run: dotnet publish $env:Project_Path --configuration Release --runtime $env:Runtime --self-contained true --output $env:Publish_Directory "-p:Version=$env:SEXTANT_VERSION" "-p:InformationalVersion=$env:SEXTANT_VERSION" "-p:IncludeSourceRevisionInInformationalVersion=false"

    - name: Check the published SSH prompt helper
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        $env:SEXTANT_ASKPASS = ""
        $helper = Join-Path $env:Publish_Directory "Sextant.AskPass.exe"
        # Without a pipe, the helper must exit quietly with code 1, not fail to load.
        $output = & $helper 2>&1
        if ($LASTEXITCODE -ne 1 -or $output) {
          throw "The published SSH prompt helper failed its startup check (exit $LASTEXITCODE): $output"
        }
        exit 0

    - name: Sign the application
      shell: pwsh
      env:
        PFX_BASE64: ${{ secrets.Base64_Encoded_Pfx }}
        PFX_PASSWORD: ${{ secrets.Pfx_Key }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
          Write-Host "Base64_Encoded_Pfx is not set. The published app is unsigned."
          exit 0
        }
        $pfx = Join-Path $env:RUNNER_TEMP "GitHubActionsWorkflow.pfx"
        try {
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe was not found in the Windows SDK."
          }
          $files = @(
            (Join-Path $env:Publish_Directory "Sextant.exe"),
            (Join-Path $env:Publish_Directory "Sextant.Git.dll"),
            (Join-Path $env:Publish_Directory "Sextant.AskPass.exe")
          )
          foreach ($file in $files) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) {
              throw "signtool exited $LASTEXITCODE for $file"
            }
          }
        } finally {
          if (Test-Path $pfx) {
            Remove-Item $pfx -Force
          }
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Sextant-win-x64
        path: artifacts/win-x64
        if-no-files-found: error

  build-macos:
    name: macOS arm64
    runs-on: macos-latest

    env:
      Solution_Name: Sextant.slnx
      Project_Path: src/Sextant.csproj
      Publish_Directory: artifacts/osx-arm64
      Runtime: osx-arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Resolve the version from the tag
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: bash src/tools/resolve-version.sh

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Execute unit tests
      run: dotnet test "$Solution_Name" --configuration Release --verbosity normal

    - name: Publish the application
      run: dotnet publish "$Project_Path" --configuration Release --runtime "$Runtime" --self-contained true --output "$Publish_Directory" -p:Version="$SEXTANT_VERSION" -p:InformationalVersion="$SEXTANT_VERSION" -p:IncludeSourceRevisionInInformationalVersion=false

    - name: Sign and notarize the application
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      run: bash src/tools/notarize-mac-app.sh "$Publish_Directory/Sextant.app"

    - name: Check the app bundle
      run: |
        app="$Publish_Directory/Sextant.app"
        test -d "$app/Contents"
        test -f "$app/Contents/Info.plist"
        test -f "$app/Contents/Resources/sextant.icns"
        test -x "$app/Contents/MacOS/Sextant"
        plutil -lint "$app/Contents/Info.plist"
        codesign --verify --strict "$app"
        tar -C "$Publish_Directory" -cf artifacts/Sextant-osx-arm64.tar Sextant.app
        mode="$(tar -tvf artifacts/Sextant-osx-arm64.tar | awk '/Contents\/MacOS\/Sextant$/ { print $1; exit }')"
        case "$mode" in
          *x*) ;;
          *)
            echo "Sextant is not executable in the archive (mode: ${mode:-missing})." >&2
            exit 1
            ;;
        esac

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        # archive: false ignores name and uses the filename as the artifact name.
        path: artifacts/Sextant-osx-arm64.tar
        archive: false
        if-no-files-found: error

  build-linux-deb:
    name: Linux deb ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            package_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            package_arch: arm64

    env:
      Solution_Name: Sextant.slnx
      Project_Path: src/Sextant.csproj
      Publish_Directory: artifacts/linux-${{ matrix.arch }}
      Runtime: linux-${{ matrix.arch }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Resolve the version from the tag
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: bash src/tools/resolve-version.sh

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Execute unit tests
      run: dotnet test "$Solution_Name" --configuration Release --verbosity normal

    - name: Publish the application
      run: dotnet publish "$Project_Path" --configuration Release --runtime "$Runtime" --self-contained true --output "$Publish_Directory" -p:Version="$SEXTANT_VERSION" -p:InformationalVersion="$SEXTANT_VERSION" -p:IncludeSourceRevisionInInformationalVersion=false

    - name: Build the deb package
      run: bash src/tools/make-deb.sh "$Publish_Directory" "$SEXTANT_VERSION" "artifacts/Sextant-$Runtime.deb" "$Runtime"

    - name: Check the deb package
      run: |
        set -euo pipefail
        deb="artifacts/Sextant-$Runtime.deb"
        dpkg-deb --info "$deb" | grep -F "Version: $SEXTANT_VERSION"
        test "$(dpkg-deb --field "$deb" Architecture)" = "${{ matrix.package_arch }}"
        dependencies="$(dpkg-deb --field "$deb" Depends)"
        for dependency in libicu libfontconfig1 libstdc++6 libgcc-s1; do
          if [[ "$dependencies" != *"$dependency"* ]]; then
            echo "Missing deb dependency: $dependency" >&2
            exit 1
          fi
        done
        contents="$(dpkg-deb --contents "$deb" | sed 's/ -> .*//' | awk '{ print $NF }')"
        echo "$contents" | grep -F -x './opt/Sextant/Sextant'
        echo "$contents" | grep -F -x './usr/bin/Sextant'
        echo "$contents" | grep -F -x './usr/share/applications/sextant.desktop'
        echo "$contents" | grep -F -x './usr/share/icons/hicolor/256x256/apps/sextant.png'

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        # archive: false ignores name and uses the filename as the artifact name.
        path: artifacts/Sextant-linux-${{ matrix.arch }}.deb
        archive: false
        if-no-files-found: error

  build-linux-rpm:
    name: Linux rpm ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            package_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            package_arch: aarch64

    env:
      Solution_Name: Sextant.slnx
      Project_Path: src/Sextant.csproj
      Publish_Directory: artifacts/linux-${{ matrix.arch }}
      Runtime: linux-${{ matrix.arch }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Resolve the version from the tag
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: bash src/tools/resolve-version.sh

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Execute unit tests
      run: dotnet test "$Solution_Name" --configuration Release --verbosity normal

    - name: Publish the application
      run: dotnet publish "$Project_Path" --configuration Release --runtime "$Runtime" --self-contained true --output "$Publish_Directory" -p:Version="$SEXTANT_VERSION" -p:InformationalVersion="$SEXTANT_VERSION" -p:IncludeSourceRevisionInInformationalVersion=false

    - name: Install rpm tooling
      run: sudo apt-get update && sudo apt-get install -y rpm

    - name: Build the rpm package
      run: bash src/tools/make-rpm.sh "$Publish_Directory" "$SEXTANT_VERSION" "artifacts/Sextant-$Runtime.rpm" "$Runtime"

    - name: Check the rpm package
      run: |
        set -euo pipefail
        rpm="artifacts/Sextant-$Runtime.rpm"
        query="$(rpm -qp --queryformat '%{NAME} %{VERSION} %{RELEASE} %{ARCH}' "$rpm")"
        ver="${SEXTANT_VERSION%%-*}"
        rel="1"
        if [[ "$SEXTANT_VERSION" == *-* ]]; then
          rel="${SEXTANT_VERSION#*-}"
        fi
        if [[ "$query" != "sextant $ver $rel ${{ matrix.package_arch }}" ]]; then
          echo "Unexpected rpm metadata: $query (expected sextant $ver $rel ${{ matrix.package_arch }})" >&2
          exit 1
        fi
        rpm -qpl "$rpm" | grep -F -x '/opt/Sextant/Sextant'
        rpm -qpl "$rpm" | grep -F -x '/usr/bin/Sextant'
        rpm -qpl "$rpm" | grep -F -x '/usr/share/applications/sextant.desktop'
        requires="$(rpm -qp --requires "$rpm")"
        for dependency in libicu; do
          if ! grep -F -x "$dependency" <<< "$requires"; then
            echo "Missing rpm dependency: $dependency" >&2
            exit 1
          fi
        done
        if [[ "$requires" == *'liblttng-ust.so.0'* ]]; then
          echo "Optional .NET tracing library added an unavailable Fedora dependency." >&2
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        # archive: false ignores name and uses the filename as the artifact name.
        path: artifacts/Sextant-linux-${{ matrix.arch }}.rpm
        archive: false
        if-no-files-found: error
