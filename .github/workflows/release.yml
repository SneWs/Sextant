# Publishes a GitHub release when a tag named like v0.1.1 or v0.1.3-beta is pushed.
# The Windows and macOS builds stay in dotnet-desktop.yml. This workflow
# passes that tag as the version. The leading v only selects the workflow;
# the build imprints the rest. It then attaches Sextant-osx-arm64.tar and
# Sextant-win-x64.zip. Branch pushes and pull requests do not run this workflow.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  actions: write
  contents: write

jobs:
  build:
    uses: ./.github/workflows/dotnet-desktop.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        path: release-artifacts

    - name: Pack the release files
      run: |
        set -euo pipefail
        find release-artifacts -print
        mkdir -p dist
        exe="$(find release-artifacts -type f -name Sextant.exe -print -quit)"
        if [[ -z "$exe" ]]; then
          echo "Sextant.exe was not in the Windows artifact." >&2
          exit 1
        fi
        (
          cd "$(dirname "$exe")"
          zip -r -q "$GITHUB_WORKSPACE/dist/Sextant-win-x64.zip" .
        )
        # Read every stored name. grep -q closes the pipe early, and pipefail
        # then fails the step even though Sextant.exe is in the archive.
        if ! unzip -Z1 dist/Sextant-win-x64.zip | tr -d '\r' | grep -F -x 'Sextant.exe' >/dev/null; then
          echo "Sextant.exe is not at the root of Sextant-win-x64.zip." >&2
          unzip -Z1 dist/Sextant-win-x64.zip
          exit 1
        fi
        mac="$(find release-artifacts -type f -name 'Sextant-osx-arm64.tar' -print -quit)"
        if [[ -z "$mac" ]]; then
          mac="$(find release-artifacts -type f -name '*.tar' -print -quit)"
        fi
        if [[ -z "$mac" ]]; then
          echo "The macOS archive was not in the downloaded artifacts." >&2
          exit 1
        fi
        cp "$mac" dist/Sextant-osx-arm64.tar
        # Read the whole listing. Stopping at the first match closes the pipe and fails under pipefail.
        mode="$(tar -tvf dist/Sextant-osx-arm64.tar | tr -d '\r' | awk '/Contents\/MacOS\/Sextant$/ { mode = $1 } END { print mode }')"
        case "$mode" in
          *x*) ;;
          *)
            echo "Sextant is not executable in the macOS archive (mode: ${mode:-missing})." >&2
            exit 1
            ;;
        esac

    - name: Publish the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tag="${GITHUB_REF#refs/tags/}"
        notes="$(mktemp)"
        cat > "$notes" << 'EOF'
        ## Downloads

        - **macOS arm64:** `Sextant-osx-arm64.tar`. Extract with `tar -xf Sextant-osx-arm64.tar`, then open `Sextant.app`.
        - **Windows x64:** `Sextant-win-x64.zip`. Extract it and run `Sextant.exe`.
        EOF
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" dist/Sextant-osx-arm64.tar dist/Sextant-win-x64.zip --clobber
        else
          gh release create "$tag" \
            --title "Sextant $tag" \
            --notes-file "$notes" \
            dist/Sextant-osx-arm64.tar \
            dist/Sextant-win-x64.zip
          generated="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" --jq .body 2>/dev/null || true)"
          if [[ -n "$generated" ]]; then
            {
              cat "$notes"
              printf '\n%s\n' "$generated"
            } > "$notes.full"
            gh release edit "$tag" --notes-file "$notes.full"
          fi
        fi
